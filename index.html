<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realbox | Coming Soon</title>
    <meta name="description" content="Realbox is coming soon. The future of tech is almost here.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="shortcut icon" href="assets/favicon.png">

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.realbox.tech/">
    <meta property="og:title" content="Realbox | Coming Soon">
    <meta property="og:description" content="We are engineering the future. Something extraordinary is on its way.">
    <meta property="og:image" content="https://www.realbox.tech/assets/logo.png">
    <meta property="og:image:alt" content="Realbox Logo">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Realbox">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.realbox.tech/">
    <meta name="twitter:title" content="Realbox | Coming Soon">
    <meta name="twitter:description" content="We are engineering the future. Something extraordinary is on its way.">
    <meta name="twitter:image" content="https://www.realbox.tech/assets/logo.png">
    <meta name="twitter:image:alt" content="Realbox Logo">

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Inter:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated futuristic canvas background -->
    <canvas id="bgCanvas"></canvas>

    <!-- Scanline overlay -->
    <div class="scanlines"></div>

    <!-- Main content -->
    <main class="main">
        <div class="card">
            <div class="logo-wrapper">
                <img src="assets/logo_background_less.png" alt="Realbox Logo" class="logo-img">
            </div>

            <div class="badge">INITIALIZING</div>

            <h1 class="title">Coming <span class="gradient-text">Soon</span></h1>
            <p class="subtitle">We are engineering the future.<br>Something extraordinary is on its way.</p>

            <div class="divider">
                <span></span><span class="divider-dot"></span><span></span>
            </div>

            <form class="notify-form" id="notifyForm">
                <input type="email" id="emailInput" class="email-input" placeholder="Enter your email to get notified"
                    required autocomplete="email" />
                <button type="submit" class="notify-btn">Notify Me</button>
            </form>

            <div class="success-msg" id="successMsg">
                <span class="check">✓</span> You're on the list! We'll notify you at launch.
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
